   <script>
   document.addEventListener('DOMContentLoaded', function() {
       const urlParams = new URLSearchParams(window.location.search);
       const error = urlParams.get('error');
       const errorMessages = {
           'invalid_email': 'Please enter a valid email address.',
           'email_not_found': 'This email address is not registered.',
           'incorrect_password': 'The password you entered is incorrect.',
           'account_locked': 'Too many failed login attempts. Your account is temporarily locked.',
           'unauthorized': 'You are not authorized to access this system.',
           'invalid_request': 'Invalid login request. Please try again.'
       };

       if (error && errorMessages[error]) {
           const errorDiv = document.createElement('div');
           errorDiv.className = 'alert alert-danger mt-3';
           errorDiv.textContent = errorMessages[error];
           document.querySelector('form').insertAdjacentElement('beforebegin', errorDiv);
       }
   });
   </script>
